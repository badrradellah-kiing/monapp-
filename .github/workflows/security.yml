name: security-gates

on: [push, pull_request]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan des secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git \
            --config /repo/.gitleaks.toml -v

      - name: Scan des dépendances (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Construire l'image
        run: docker build -t mon-app:${{ github.sha }} .

      - name: Scan de l'image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: mon-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
